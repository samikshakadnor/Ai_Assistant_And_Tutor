<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: #202124;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .google-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    @media (max-width: 480px) {
      .google-card {
        border: none;
        padding: 20px;
        box-shadow: none;
      }
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #e8f0fe;
      overflow: hidden;
      display: none;
    }
    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background: #1a73e8;
      animation: indeterminate 1.5s infinite linear;
      transform-origin: 0% 50%;
    }
    @keyframes indeterminate {
      0% { transform: translateX(0) scaleX(0); }
      40% { transform: translateX(0) scaleX(0.4); }
      100% { transform: translateX(100%) scaleX(0.5); }
    }
    .google-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .google-logo {
      margin-bottom: 16px;
    }
    .google-title {
      font-size: 24px;
      font-weight: 400;
      color: #202124;
      line-height: 1.3333;
      margin-bottom: 8px;
    }
    .google-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: #5f6368;
      line-height: 1.5;
    }
    .app-name {
      color: #1a73e8;
      font-weight: 500;
    }
    .account-list {
      display: flex;
      flex-direction: column;
      margin-top: 16px;
    }
    .account-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e8eaed;
      cursor: pointer;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: background-color 0.15s ease;
    }
    .account-item:hover {
      background-color: #f8f9fa;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 4px;
    }
    .account-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1a73e8;
      color: #fff;
      font-weight: 500;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .account-info {
      flex: 1;
      min-width: 0;
    }
    .account-name {
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-email {
      font-size: 12px;
      color: #5f6368;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .use-another-row {
      display: flex;
      align-items: center;
      padding: 14px 0;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: #3c4043;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.15s ease;
    }
    .use-another-row:hover {
      background-color: #f8f9fa;
      padding-left: 8px;
      border-radius: 4px;
    }
    .use-another-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      color: #5f6368;
      font-size: 20px;
    }
    .input-screen {
      display: none;
      flex-direction: column;
      gap: 20px;
      margin-top: 10px;
    }
    .input-field-wrapper {
      position: relative;
    }
    .input-field {
      width: 100%;
      padding: 14px 14px;
      font-size: 16px;
      color: #202124;
      border: 1px solid #dadce0;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: #1a73e8;
      border-width: 2px;
      padding: 13px 13px;
    }
    .input-label {
      position: absolute;
      top: -10px;
      left: 10px;
      background: #ffffff;
      padding: 0 4px;
      font-size: 12px;
      color: #1a73e8;
      font-weight: 500;
    }
    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }
    .text-btn {
      background: none;
      border: none;
      color: #1a73e8;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 8px 0;
    }
    .text-btn:hover {
      color: #155724;
    }
    .primary-btn {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    .primary-btn:hover {
      background-color: #1557b0;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
    }
    .google-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 28px;
      font-size: 12px;
      color: #5f6368;
    }
    .google-footer a {
      color: #5f6368;
      text-decoration: none;
      margin-left: 12px;
    }
    .error-msg {
      color: #d93025;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="google-card">
    <div id="progressBar" class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>

    <!-- Google Header -->
    <div class="google-header">
      <div class="google-logo">
        <svg viewBox="0 0 74 24" width="74" height="24">
          <path fill="#4285F4" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#34A853" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#FBBC05" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          <path fill="#EA4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        </svg>
      </div>
      <h1 class="google-title">Sign in with Google</h1>
      <p class="google-subtitle">to continue to <span class="app-name">AI Assistant &amp; Tutor</span></p>
    </div>

    <!-- Screen 1: Account Chooser -->
    <div id="accountPickerScreen">
      <div id="accountsContainer" class="account-list">
        <!-- Rendered dynamically -->
      </div>

      <button type="button" class="use-another-row" onclick="showInputScreen()">
        <div class="use-another-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <span>Use another account</span>
      </button>
    </div>

    <!-- Screen 2: Enter Any Email -->
    <div id="inputScreen" class="input-screen">
      <form onsubmit="handleCustomEmailSubmit(event)">
        <div class="input-field-wrapper">
          <span class="input-label">Email or phone</span>
          <input
            id="emailInput"
            type="email"
            class="input-field"
            placeholder="Enter your Gmail"
            required
            autocomplete="email"
            autofocus
          />
        </div>
        <div id="emailError" class="error-msg">Enter a valid email address</div>

        <div style="margin-top: 16px;">
          <div class="input-field-wrapper">
            <span class="input-label">Your Name (Optional)</span>
            <input
              id="nameInput"
              type="text"
              class="input-field"
              placeholder="e.g. Alex"
              autocomplete="name"
            />
          </div>
        </div>

        <div class="actions-row">
          <button type="button" class="text-btn" onclick="showAccountPicker()">Back</button>
          <button type="submit" class="primary-btn">Next</button>
        </div>
      </form>
    </div>

    <div class="google-footer">
      <span>English (United States)</span>
      <div>
        <a href="https://support.google.com/accounts" target="_blank">Help</a>
        <a href="https://policies.google.com/privacy" target="_blank">Privacy</a>
        <a href="https://policies.google.com/terms" target="_blank">Terms</a>
      </div>
    </div>
  </div>

  <script>
    // Load accounts saved on this device or defaults
    function loadSavedAccounts() {
      try {
        const saved = JSON.parse(localStorage.getItem('recent_google_accounts') || '[]');
        if (Array.isArray(saved) && saved.length > 0) return saved;
      } catch (e) {}

      // Default familiar accounts
      return [
        { email: 'student.learner@gmail.com', name: 'Student Learner' },
        { email: 'demo.developer@gmail.com', name: 'Developer User' }
      ];
    }

    function renderAccounts() {
      const accounts = loadSavedAccounts();
      const container = document.getElementById('accountsContainer');
      container.innerHTML = '';

      accounts.forEach(acc => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'account-item';
        item.onclick = () => selectAccount(acc.email, acc.name, acc.picture);

        const initial = (acc.name?.[0] || acc.email[0]).toUpperCase();
        item.innerHTML = `
          <div class="account-avatar">
            ${acc.picture ? `<img src="${acc.picture}" alt="${acc.name}">` : initial}
          </div>
          <div class="account-info">
            <div class="account-name">${acc.name}</div>
            <div class="account-email">${acc.email}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function showInputScreen() {
      document.getElementById('accountPickerScreen').style.display = 'none';
      document.getElementById('inputScreen').style.display = 'flex';
      document.getElementById('emailInput').focus();
    }

    function showAccountPicker() {
      document.getElementById('inputScreen').style.display = 'none';
      document.getElementById('accountPickerScreen').style.display = 'block';
    }

    function selectAccount(email, name, picture) {
      document.getElementById('progressBar').style.display = 'block';

      const cleanEmail = email.trim().toLowerCase();
      const cleanName = name || cleanEmail.split('@')[0].replace(/[._]/g, ' ');
      const userPicture = picture || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(cleanEmail)}`;

      // Update recent accounts
      try {
        const current = loadSavedAccounts().filter(a => a.email.toLowerCase() !== cleanEmail);
        const updated = [{ email: cleanEmail, name: cleanName, picture: userPicture }, ...current].slice(0, 4);
        localStorage.setItem('recent_google_accounts', JSON.stringify(updated));
      } catch (e) {}

      // Short delay to mirror Google's authentic sign-in transition
      setTimeout(() => {
        const payload = {
          type: 'GOOGLE_AUTH_SUCCESS',
          email: cleanEmail,
          name: cleanName,
          picture: userPicture,
          token: 'gauth-' + Math.random().toString(36).substring(2) + '-' + Date.now()
        };

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
          window.close();
        } else {
          // If standalone or mobile redirect, store and redirect back
          localStorage.setItem('pending_google_auth', JSON.stringify(payload));
          window.location.href = '/';
        }
      }, 600);
    }

    function handleCustomEmailSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();

      if (!email || !email.includes('@')) {
        document.getElementById('emailError').style.display = 'block';
        return;
      }
      document.getElementById('emailError').style.display = 'none';
      selectAccount(email, name);
    }

    renderAccounts();
  </script>
</body>
</html>
